<li id="{id}">
    <div class="post-data">
        <p><i class="bi bi-clock"></i>{data}, {hora}</p>
        <p>{titulo}</p>
        <p>{post}</p>
    </div>
    <div class="post-reactions">
        <div class="like-reaction">
            <i class="bi bi-heart-fill btnHeartFill" data-id="{id}"></i>
            <span class="countHeartFill">{numLikes}</span>
        </div>
        <div class="dislike-reaction">
            <i class="bi bi-heartbreak-fill btnHeartbreakFill" data-id="{id}"></i>
            <span class="countHeartbreakFill">{numDislikes}</span>
        </div>
    </div>
</li>
