<tr>
    <td>
        <input type='checkbox' name='checkProduto' id='{id}' {checked}>
    </td>
    <td>{produto}</td>
    <td>{marca}</td>
    <td>{quantidade}</td>
    <td>
        <a href='form_produto.php?action=edit&id={id}' class='btn-action'>
            <img width='24' height='24' src='./img/pencil--v2.png' alt='pencil--v2'/>
        </a>
        <button class='btn-action btn-del' id='{id}'>
            <img width='24' height='24' src='./img/trash--v1.png' alt='trash--v1'/>
        </button>
    </td>
</tr>
